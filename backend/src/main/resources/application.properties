spring.application.name=modulith
server.port=8080

spring.jpa.open-in-view=false
# Let Hibernate create the schema first, then run data.sql to seed it.
spring.jpa.defer-datasource-initialization=true
spring.datasource.url=jdbc:h2:mem:modulith

# The React build is served by frontend.web.SpaWebConfig from spring.web.resources.static-locations.
spring.web.resources.add-mappings=false

# Actuator on a separate port, reachable from this host only. GET/POST /actuator/loggers[/{name}]
# reads and changes log levels at runtime without a restart (see README). Bind to another address,
# or add Spring Security, before exposing it beyond localhost.
management.server.port=8081
management.server.address=127.0.0.1
management.endpoints.web.exposure.include=health,loggers,apicontract,swagger-ui

# Swagger UI at http://localhost:8081/actuator/swagger-ui, showing the hand-written contract.
# springdoc's own code-derived spec stays unexposed (no "openapi" in the exposure list).
# "Try it out" is disabled because the API lives on another port (8080), which would require CORS.
springdoc.use-management-port=true
springdoc.swagger-ui.url=/actuator/apicontract
springdoc.swagger-ui.supported-submit-methods=
