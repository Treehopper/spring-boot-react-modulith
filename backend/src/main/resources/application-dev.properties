# Local development: serve the React build straight from frontend/dist on disk,
# which `npm run watch` rewrites on every change. Refresh the browser to see the change;
# no Java rebuild or restart needed. Both paths are listed so this works whether the
# working directory is the repository root (IDE) or backend/ (mvn spring-boot:run).
spring.web.resources.static-locations=file:frontend/dist/,file:../frontend/dist/
spring.web.resources.cache.period=0
